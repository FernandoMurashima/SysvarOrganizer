[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sysvar-organizer"
dynamic = ["version"]
description = "Sysvar Organizer - organizador de arquivos para Windows (OIA-001)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6>=6.8,<7",
    "Pillow>=10.3,<13",
    "numpy>=1.26,<3",
]

[project.gui-scripts]
sysvar-organizer = "sysvar_organizer.app:main"

[tool.setuptools.dynamic]
version = { attr = "sysvar_organizer.__version__" }

[tool.setuptools.packages.find]
include = ["sysvar_organizer*"]
